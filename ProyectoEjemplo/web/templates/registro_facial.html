<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro Facial - UMG</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        body { background-color: #f8f9fa; }
        .camera-container {
            position: relative;
            width: 100%;
            max-width: 640px;
            margin: 0 auto;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            background: #000;
        }
        video {
            width: 100%;
            display: block;
        }
        canvas {
            display: none;
        }
        .overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            border: 2px solid rgba(255, 255, 255, 0.5);
            width: 200px;
            height: 200px;
            border-radius: 50%;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-dark bg-primary mb-4">
        <div class="container">
            <a class="navbar-brand" href="/">UMG Biometric System</a>
        </div>
    </nav>

    <div class="container">
        <div class="row">
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header">
                        <h4>Datos del Usuario</h4>
                    </div>
                    <div class="card-body">
                        <form id="registroForm">
                            <div class="mb-3">
                                <label for="nombre" class="form-label">Nombre</label>
                                <input type="text" class="form-control" id="nombre" required>
                            </div>
                            <div class="mb-3">
                                <label for="apellido" class="form-label">Apellido</label>
                                <input type="text" class="form-control" id="apellido" required>
                            </div>
                            <div class="mb-3">
                                <label for="email" class="form-label">Email</label>
                                <input type="email" class="form-control" id="email" required>
                            </div>
                            <div class="mb-3">
                                <label for="telefono" class="form-label">Teléfono</label>
                                <input type="tel" class="form-control" id="telefono">
                            </div>
                            <div class="mb-3">
                                <label for="codigo_carnet" class="form-label">Código / Carnet</label>
                                <input type="text" class="form-control" id="codigo_carnet" required>
                            </div>
                            <div class="mb-3">
                                <label for="tipo_persona" class="form-label">Tipo</label>
                                <select class="form-select" id="tipo_persona" required>
                                    <option value="estudiante">Estudiante</option>
                                    <option value="catedrático">Catedrático</option>
                                    <option value="administrativo">Administrativo</option>
                                </select>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
            
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header">
                        <h4>Captura Facial</h4>
                    </div>
                    <div class="card-body text-center">
                        <div class="camera-container mb-3">
                            <video id="video" autoplay playsinline></video>
                            <canvas id="canvas"></canvas>
                            <div class="overlay"></div>
                        </div>
                        <button id="btnCapture" class="btn btn-success btn-lg w-100">
                            <i class="bi bi-camera"></i> Capturar y Registrar
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const btnCapture = document.getElementById('btnCapture');
        
        // Access camera
        async function startCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: true });
                video.srcObject = stream;
            } catch (err) {
                console.error("Error accessing camera:", err);
                Swal.fire('Error', 'No se pudo acceder a la cámara', 'error');
            }
        }
        
        startCamera();

        btnCapture.addEventListener('click', async () => {
            // Validate form
            const form = document.getElementById('registroForm');
            if (!form.checkValidity()) {
                form.reportValidity();
                return;
            }

            // Capture image
            const context = canvas.getContext('2d');
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            context.drawImage(video, 0, 0, canvas.width, canvas.height);
            const imageData = canvas.toDataURL('image/jpeg');

            // Collect data
            const data = {
                nombre: document.getElementById('nombre').value,
                apellido: document.getElementById('apellido').value,
                email: document.getElementById('email').value,
                telefono: document.getElementById('telefono').value,
                codigo_carnet: document.getElementById('codigo_carnet').value,
                tipo_persona: document.getElementById('tipo_persona').value,
                image: imageData
            };

            // Send to server
            try {
                btnCapture.disabled = true;
                btnCapture.textContent = 'Procesando...';
                
                const response = await fetch('/api/registrar_rostro', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
                
                const result = await response.json();
                
                if (result.success) {
                    Swal.fire('Éxito', result.message, 'success').then(() => {
                        window.location.reload();
                    });
                } else {
                    Swal.fire('Error', result.message, 'error');
                }
            } catch (err) {
                console.error(err);
                Swal.fire('Error', 'Ocurrió un error al registrar', 'error');
            } finally {
                btnCapture.disabled = false;
                btnCapture.textContent = 'Capturar y Registrar';
            }
        });
    </script>
</body>
</html>
